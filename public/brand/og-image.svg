<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1714" />
      <stop offset="50%" stop-color="#12382D" />
      <stop offset="100%" stop-color="#0B1714" />
    </linearGradient>
    <radialGradient id="og-glow-center" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#24B47E" stop-opacity="0.25" />
