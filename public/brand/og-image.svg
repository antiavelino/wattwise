    <g transform="scale(2.2)">
      <path
        d="M7 11.5C7 10.67 7.67 10 8.5 10H14.2C15.08 10 15.84 10.6 16.05 11.45L20.8 30.6L24.8 14.5C25.01 13.65 25.77 13.05 26.65 13.05H29.5C30.38 13.05 31.14 13.65 31.35 14.5L35.35 30.6L40.1 11.45C40.31 10.6 41.07 10 41.95 10H47.5C48.33 10 49 10.67 49 11.5V12C49 12.35 48.88 12.69 48.66 12.96L39.4 39.5C39.12 40.35 38.32 41 37.4 41H34.2C33.28 41 32.48 40.35 32.2 39.5L28 22.5L23.8 39.5C23.52 40.35 22.72 41 21.8 41H18.6C17.68 41 16.88 40.35 16.6 39.5L7.34 12.96C7.12 12.69 7 12.35 7 12V11.5Z"
