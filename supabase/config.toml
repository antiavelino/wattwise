# ==============================================================================
# WattWise — Supabase Local Development Configuration
# ==============================================================================
project_id = "wattwise"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# ------------------------------------------------------------------------------
# Edge Functions Configuration
# ------------------------------------------------------------------------------

# Multi-tenant Team Invitation Service (Requires authenticated user JWT)
[functions.team-invite]
enabled = true
verify_jwt = true
entrypoint = "./functions/team-invite/index.ts"
